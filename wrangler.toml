#:schema node_modules/wrangler/config-schema.json
# Cloudflare Worker that serves the Spinventory cloud API (Hono + D1).
# The PWA itself is still built by Vite and hosted separately (e.g. GitHub Pages).
name = "spinventory-api"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Set to "false" to close sign-ups. The very first account can always register.
ALLOW_REGISTRATION = "true"
# Comma-separated browser origins allowed to call the API, or "*" for any origin.
# Auth uses Bearer tokens (no cookies), so "*" is safe; restrict it if you prefer, e.g.
# "https://tr1028.github.io,http://127.0.0.1:5173".
CORS_ORIGINS = "*"
# PBKDF2-SHA256 iterations for new password hashes (10000-100000; 100000 is the Workers maximum).
# 100000 costs ~60 ms of CPU per sign-in, above the Workers Free plan's 10 ms limit (requests fail
# with error 1102), so keep 10000 on the Free plan and raise it to 100000 on Workers Paid.
# Every hash stores its own iteration count; older hashes are upgraded at the next sign-in.
PBKDF2_ITERATIONS = "10000"

# Secrets (never commit them):
#   JWT_SECRET  – HMAC key for login tokens (>= 16 chars).
#                 Production: `pnpm exec wrangler secret put JWT_SECRET`
#                 Local dev:  copy .dev.vars.example to .dev.vars

[[d1_databases]]
binding = "DB"
database_name = "spinventory-db"
# Replace with the id printed by `pnpm exec wrangler d1 create spinventory-db` before deploying.
# The placeholder is fine for local development (`wrangler dev` / `--local`).
database_id = "00000000-0000-0000-0000-000000000000"
